  - { icon: "mail", url: "mailto:school@example.edu.cn" }

features:
  dark_mode: true
  back_to_top: true
  reveal: true
  sticky_header: true
  stats_animation: true

seo:
  description: "XX实验中学官方网站：学校概况、教育教学、招生信息、校园动态。"
  keywords: "中学,招生,教育,示范高中"
  jsonld: true

analytics:
  google: ""
  cloudflare: ""
