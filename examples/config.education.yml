  title: "联系我们"
  subtitle: "招生与咨询渠道"
  address: "XX市XX区学府路88号"
  phone: "0510-88888888"
  email: "school@example.edu.cn"
  hours: "工作日 8:00 - 17:30"
  wechat: ""
  form_action: ""
  map: ""

footer:
  about: "XX实验中学创办于 1962 年，是省示范性普通高级中学、省文明校园。"
  columns:
    - title: "学校概况"
      items:
        - { name: "学校简介", url: "/about/" }
        - { name: "校园动态", url: "/news/" }
    - title: "师生服务"
      items:
        - { name: "教育教学", url: "/products/" }
        - { name: "联系我们", url: "/contact/" }
  copyright: "© 2026 XX实验中学"
  icp: "苏ICP备00000000号"
  icp_url: "https://beian.miit.gov.cn/"
  police: ""
  police_url: ""
  show_powered: true

