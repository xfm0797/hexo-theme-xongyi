#  开发者: XFM | https://www.lovou.pw | https://t.me/xfm520
#  E-mail: njat6880@agent.qq.com
#
#  三套预设布局: enterprise(企业) / government(政务) / education(教育)
#  完整文档见仓库 README.md
# ============================================================

## 预设风格，决定默认配色与视觉基调
## enterprise: 商务蓝 | government: 政务红 | education: 学院青
preset: enterprise

# ------------------------------------------------------------
# 品牌
# ------------------------------------------------------------
brand:
  name: "Xongyi 演示站"          # 站点名称，logo 为空时显示
  slogan: "专业 · 可靠 · 值得信赖"
  logo: "/images/logo.svg"       # 建议高度 40px；留空 "" 则仅显示文字
  favicon: "/images/favicon.svg"

# ------------------------------------------------------------
# 顶部导航
# ------------------------------------------------------------
menu:
  - { name: "首页", url: "/" }
  - { name: "关于我们", url: "/about/" }
  - { name: "产品服务", url: "/products/" }
  - { name: "新闻动态", url: "/news/" }
  - { name: "联系我们", url: "/contact/" }

# 导航栏右侧按钮（不填 name 则不显示）
nav_button:
  name: "立即咨询"
  url: "/contact/"

# ------------------------------------------------------------
# 首页板块（按顺序渲染；删除某一行即可隐藏该板块）
# 可用板块: hero / quicklinks / stats / services / about /
#           products / news / team / partners / gallery / cta / contact /
#           about-contact（关于我们 + 联系我们 左右合排）
# ------------------------------------------------------------
sections:
  - hero
  - quicklinks
  - stats
  - services
  - products
  - news
  - team
  - partners
  - gallery
  - cta
  - about-contact

# ------------------------------------------------------------
# hero 首屏横幅（title 支持 <em> 高亮与 <br> 换行）
# ------------------------------------------------------------
hero:
  badge: "Xongyi · 通用企业官网主题"
  title: "让机构形象<br><em>更具竞争力</em>"
  subtitle: "基于 Hexo 的高性能官网解决方案，一键部署至 GitHub Pages、Cloudflare、EdgeOne、Vercel、Netlify，内容配置化，无需修改代码即可完成整站搭建。"
  buttons:
    - { name: "了解我们", url: "/about/", primary: true }
    - { name: "查看产品", url: "/products/" }
  image: "/images/hero.svg"      # 首屏插图；留空则显示居中窄幅布局

# ------------------------------------------------------------
# quicklinks 快捷入口（政务/校园常用：办事大厅、下载中心等）
# ------------------------------------------------------------
quicklinks:
  title: "快速通道"
  subtitle: "常用服务一键直达"
  items:
    - { icon: "zap", name: "在线申报", url: "/contact/" }
    - { icon: "file-text", name: "下载中心", url: "/about/" }
    - { icon: "search", name: "信息查询", url: "/archives/" }
    - { icon: "message-circle", name: "咨询反馈", url: "/contact/" }

# ------------------------------------------------------------
# stats 数据统计（数字自动滚动动画；value 支持小数）
# ------------------------------------------------------------
stats:
  items:
    - { value: 500, suffix: "+", label: "服务客户" }
    - { value: 120, suffix: "+", label: "成功案例" }
    - { value: 10, suffix: " 年", label: "行业经验" }
    - { value: 99.9, suffix: "%", label: "服务可用性" }

# ------------------------------------------------------------
# services 核心业务/服务
# 可用图标见 README「图标速查」：rocket/monitor/cloud/shield/chart/
# users/settings/globe/book-open/building/award/target/zap/code/file-text...
# ------------------------------------------------------------
services:
  title: "核心业务"
  subtitle: "我们为客户提供全方位的专业服务"
  items:
    - { icon: "monitor", title: "软件开发", desc: "定制化软件解决方案，助力机构数字化转型。", url: "/products/" }
    - { icon: "cloud", title: "云服务", desc: "高可用云架构设计与部署运维托管服务。", url: "/products/" }
    - { icon: "shield", title: "安全保障", desc: "等保合规、数据加密与安全审计服务。", url: "/products/" }
    - { icon: "chart", title: "数据分析", desc: "业务数据挖掘与可视化决策支持。", url: "/products/" }
    - { icon: "users", title: "咨询培训", desc: "行业专家提供一对一咨询与团队培训。", url: "/products/" }
    - { icon: "settings", title: "运维支持", desc: "7×24 小时快速响应，保障业务连续运行。", url: "/products/" }

# ------------------------------------------------------------
# about-contact 关于我们 + 联系我们（左右合排）
# 文案取自下方 about 与 contact 节点，此节点仅控制开关
# ------------------------------------------------------------
about-contact:
  enable: true

# ------------------------------------------------------------
# about 关于我们（content 支持 HTML）
# 说明：板块列表中的 about-contact 会左右合排展示本节点与下方 contact 节点的内容
# ------------------------------------------------------------
about:
  title: "关于我们"
  subtitle: "十余年深耕，只为更专业的服务"
  image: "/images/about.svg"
  content: |
    <p>我们是一家专注于数字化服务的科技公司，成立于 2016 年，为政府机构、企业与学校提供高质量的软件产品与解决方案。</p>
    <ul>
      <li>核心成员平均 8 年以上行业经验</li>
      <li>标准化服务流程，全程可视可控</li>
      <li>累计交付 500+ 企业级项目</li>
    </ul>
  link:
    name: "了解更多"
    url: "/about/"

# ------------------------------------------------------------
# products 产品与案例
# ------------------------------------------------------------
products:
  title: "产品与案例"
  subtitle: "经典案例见证专业实力"
  items:
    - { image: "/images/thumb-1.svg", title: "智慧园区管理平台", desc: "园区一体化运营管理，覆盖招商、物业与能耗。", url: "/products/", tags: ["SaaS", "物联网"] }
    - { image: "/images/thumb-2.svg", title: "数据可视化决策平台", desc: "实时大屏与经营看板，让数据驱动决策。", url: "/products/", tags: ["大数据", "BI"] }
    - { image: "/images/thumb-3.svg", title: "智慧校园综合平台", desc: "教务管理、家校互通与校园安全一体化。", url: "/products/", tags: ["教育", "移动端"] }
  link:
    name: "查看全部"
    url: "/products/"

# ------------------------------------------------------------
# news 新闻动态（自动取最新文章）
# ------------------------------------------------------------
news:
  title: "新闻动态"
  subtitle: "了解我们的最新进展"
  count: 3                       # 首页展示条数
  more:
    name: "查看全部"
    url: "/news/"

# ------------------------------------------------------------
# team 团队风采
# ------------------------------------------------------------
team:
  title: "核心团队"
  subtitle: "经验丰富的专业团队"
  items:
    - { name: "张明", role: "创始人 / CEO", avatar: "/images/avatar.svg", desc: "15 年软件行业经验" }
    - { name: "李婷", role: "技术合伙人 / CTO", avatar: "/images/avatar.svg", desc: "前一线大厂架构师" }
    - { name: "王强", role: "设计总监", avatar: "/images/avatar.svg", desc: "专注体验设计 10 年" }
    - { name: "赵芸", role: "客户成功总监", avatar: "/images/avatar.svg", desc: "服务客户 200+ 家" }

# ------------------------------------------------------------
# partners 合作伙伴（logo 为空时显示名称文字）
# ------------------------------------------------------------
partners:
  title: "合作伙伴"
  subtitle: "与众多优秀机构长期同行"
  items:
    - { name: "科技集团", logo: "" }
    - { name: "云服务商", logo: "" }
    - { name: "商业银行", logo: "" }
    - { name: "示范中学", logo: "" }
    - { name: "政务中心", logo: "" }
    - { name: "产业园区", logo: "" }

# ------------------------------------------------------------
# gallery 机构风采图库
# ------------------------------------------------------------
gallery:
  title: "机构风采"
  subtitle: "工作环境与团队活动"
  items:
    - { image: "/images/thumb-1.svg", caption: "年度技术峰会" }
    - { image: "/images/thumb-2.svg", caption: "团队建设活动" }
    - { image: "/images/thumb-3.svg", caption: "客户交流现场" }
    - { image: "/images/thumb-1.svg", caption: "公益志愿服务" }

# ------------------------------------------------------------
# cta 行动号召条
# ------------------------------------------------------------
cta:
  title: "准备好了吗？让我们一起开始合作"
  subtitle: "告诉我们您的需求，1 个工作日内获得专属方案"
  button:
    name: "立即咨询"
    url: "/contact/"

# ------------------------------------------------------------
# contact 联系我们
# ------------------------------------------------------------
contact:
  title: "联系我们"
  subtitle: "随时欢迎您的咨询与合作"
  address: "XX 省 XX 市科技产业园创新大厦 12 层"
  phone: "400-000-0000"
  email: "hello@example.com"
  hours: "工作日 9:00 - 18:00"
  wechat: ""                     # 微信二维码图片地址，留空不显示
  # 表单提交地址（如 Formspree: https://formspree.io/f/xxxxx），留空则不渲染表单
  form_action: ""
  map: ""                        # 地图 iframe 嵌入地址，留空不显示

# ------------------------------------------------------------
# 页脚
# ------------------------------------------------------------
footer:
  about: "专注于数字化服务的科技公司，为政府机构、企业与学校提供高质量的软件产品与解决方案。"
  columns:
    - title: "快速导航"
      items:
        - { name: "首页", url: "/" }
        - { name: "关于我们", url: "/about/" }
        - { name: "新闻动态", url: "/news/" }
    - title: "服务支持"
      items:
        - { name: "产品服务", url: "/products/" }
        - { name: "联系我们", url: "/contact/" }
        - { name: "归档", url: "/archives/" }
  copyright: "© 2026 Xongyi 演示站 · 保留所有权利"
  icp: ""                        # ICP 备案号，如 京ICP备00000000号
  icp_url: "https://beian.miit.gov.cn/"
  police: ""                     # 公安备案号（选填）
  police_url: ""
  show_powered: true             # 显示 "Powered by Hexo · Theme Xongyi"

# ------------------------------------------------------------
# 社交链接（可用图标: mail / send / github / globe / message-circle / link）
# ------------------------------------------------------------
social:
  - { icon: "mail", url: "mailto:njat6880@agent.qq.com" }
  - { icon: "send", url: "https://t.me/xfm520" }
  - { icon: "globe", url: "https://www.lovou.pw" }

# ------------------------------------------------------------
# 功能开关
# ------------------------------------------------------------
features:
  dark_mode: true                # 暗色模式切换按钮
  back_to_top: true              # 返回顶部按钮
  reveal: true                   # 滚动进入视口淡入动画
  sticky_header: true            # 顶部导航吸顶
  stats_animation: true          # 数字滚动动画

# ------------------------------------------------------------
# SEO
# ------------------------------------------------------------
seo:
  description: ""                # 留空时回退到站点配置的 description
  keywords: ""                   # 留空时回退到站点配置的 keywords
  jsonld: true                   # 输出 Organization 结构化数据

# ------------------------------------------------------------
# 统计分析（填入 ID 即启用，留空关闭）
# ------------------------------------------------------------
analytics:
  google: ""                     # 如 G-XXXXXXXXXX
  cloudflare: ""                 # Cloudflare Web Analytics Beacon Token
