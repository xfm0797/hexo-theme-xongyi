<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Xongyi illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f8ff"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" rx="28" fill="url(#bg)"/>
  <!-- 装饰圆 -->
  <circle cx="560" cy="80" r="90" fill="#bfdbfe" opacity=".5"/>
  <circle cx="70" cy="420" r="70" fill="#93c5fd" opacity=".35"/>
  <!-- 浏览器窗口 -->
  <rect x="90" y="90" width="460" height="330" rx="18" fill="url(#card)" stroke="#dbeafe"/>
  <rect x="90" y="90" width="460" height="44" rx="18" fill="#e8f1fe"/>
  <circle cx="118" cy="112" r="7" fill="#fca5a5"/>
  <circle cx="142" cy="112" r="7" fill="#fcd34d"/>
  <circle cx="166" cy="112" r="7" fill="#86efac"/>
  <rect x="210" y="102" width="230" height="20" rx="10" fill="#dbeafe"/>
  <!-- 内容块 -->
  <rect x="120" y="160" width="180" height="18" rx="9" fill="#2563eb" opacity=".85"/>
  <rect x="120" y="190" width="260" height="12" rx="6" fill="#c7d9f7"/>
  <rect x="120" y="212" width="220" height="12" rx="6" fill="#c7d9f7"/>
  <rect x="120" y="240" width="96" height="30" rx="15" fill="#2563eb"/>
  <rect x="228" y="240" width="96" height="30" rx="15" fill="#e2ecfe"/>
  <!-- 图表卡片 -->
  <rect x="120" y="296" width="180" height="94" rx="12" fill="#ffffff" stroke="#dbeafe"/>
  <rect x="136" y="352" width="18" height="24" rx="4" fill="#93c5fd"/>
  <rect x="164" y="332" width="18" height="44" rx="4" fill="#60a5fa"/>
  <rect x="192" y="316" width="18" height="60" rx="4" fill="#2563eb"/>
  <rect x="220" y="340" width="18" height="36" rx="4" fill="#60a5fa"/>
