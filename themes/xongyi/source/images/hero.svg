  <rect x="320" y="296" width="200" height="94" rx="12" fill="#ffffff" stroke="#dbeafe"/>
  <circle cx="348" cy="322" r="10" fill="#bfdbfe"/>
  <rect x="368" y="316" width="120" height="11" rx="5.5" fill="#c7d9f7"/>
